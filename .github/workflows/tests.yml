name: tests

# GPU-free R test suites (#163).
#
# These suites were, until #163, invoked by nothing at all — not the pre-push
# hook, not the Makefile, not CI. This workflow is the half of the gate that a
# `git push --no-verify` cannot skip.
#
# Kept separate from docs.yml deliberately: that workflow is named `docs` and its
# header scopes it to markdown links, version strings and Quarto rendering. Test
# execution is a different concern with a different (much heavier) dependency
# set, and mixing them would make a slow renv restore a prerequisite for a 30 s
# link check.
#
# As with docs.yml, nothing GPU-dependent runs here: hosted runners have no
# Ampere card. Everything below drives pure R functions over checked-in sources
# and canned fixtures.

on:
  push:
  pull_request:

jobs:

  r-suites:
    name: GPU-free R suites
    runs-on: ubuntu-latest

    steps:
      # Full checkout, not shallow or path-filtered: tests/bench_all/test_bench_all.R
      # asserts the discovered bench corpus has >= 40 entries (currently 48, all
      # tracked), so a partial checkout fails the suite for the wrong reason.
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      # renv.lock pins cloud.r-project.org (renv.lock:3-8), which serves source
      # tarballs only. Left alone, every cache miss source-builds the locked
      # dependency set: that is slow, and it fails outright on any package
      # needing a system library the runner lacks — `fs` wants libuv1-dev, and
      # it drags bslib, sass, pkgload, rmarkdown and testthat down with it.
      # docs.yml:94-95 documents the same trap from the other direction.
      #
      # setup-r with use-public-rspm exports the Posit Package Manager binary
      # repo for this runner's distro as $RSPM. Use that env var directly.
      #
      # Do NOT try to read this out of R with getOption("repos")[["CRAN"]]:
      # this repo's .Rprofile activates renv, which resets `repos` from the
      # lockfile, so R reports cloud.r-project.org and the override silently
      # becomes a no-op that reinstates the source-only repo it was meant to
      # replace. Measured: that is exactly how the first version of this job
      # failed.
      - name: Point renv at the binary repo setup-r configured
        run: |
          echo "Binary repo: $RSPM"
          test -n "$RSPM"   # fail loudly rather than silently falling back to source
          echo "RENV_CONFIG_REPOS_OVERRIDE=$RSPM" >> "$GITHUB_ENV"

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-r4.6.0-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-r4.6.0-

      # cuasmR is excluded from the restore on purpose: renv.lock:391-394 records
      # it as Source: Local, which describes a package built from this working
      # tree rather than one fetchable from a repository. It is installed from
      # source in the next step instead — which is also what keeps CI honest,
      # since three of the four suites load the INSTALLED cuasmR while the
      # package suite loads the source tree. Installing from the working tree
      # means both halves see the same code.
      - name: Restore R dependencies (excluding the local cuasmR package)
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE))
            install.packages("renv")
          renv::restore(exclude = "cuasmR")

      - name: Install cuasmR from the working tree
        run: R CMD INSTALL R/cuasmR

      - name: List the suites that will run
        run: Rscript scripts/audit/run_r_tests.R --list

      # Runs the same entry point the pre-push hook runs. No `make` prerequisites
      # are triggered: test-r has none, by design.
      #
      # Expect 3 skips: R/cuasmR/tests/testthat/test-roundtrip.R needs
      # kernels/tutorial/vector_add.sm_86.cubin, which is gitignored (.gitignore:2)
      # and cannot exist on a runner, and also needs nvdisasm on PATH. That
      # coverage is local-only — a fact worth remembering before treating this
      # job as authoritative for everything.
      - name: Run the GPU-free R suites
        run: make test-r
