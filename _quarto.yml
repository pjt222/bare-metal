project:
  type: website
  output-dir: _site
  # Quarto copies files that the rendered pages LINK to, which is how CLAUDE.md
  # (raw, unrendered) and viz/research-map/ (a standalone JS app whose absolute
  # /src/ paths 404 outside its own dev server) ended up in the first build.
  # They are gone because the links now point at GitHub, not because anything
  # here excludes them: what gets copied is a consequence of what the documents
  # reference, so check `_site/` after adding a link that leaves the site.
  # Trying to control this with `resources:` negations made it worse — R/ and
  # renv/ started being copied.
  render:
    - index.qmd
    - README.md
    - SETUP.md
    - AGENTS.md
    - CONTRIBUTING.md
    - CHANGELOG.md
    - docs/index.md
    - docs/*.md
    # Session scratch, not documentation: it says so in its own opening lines
    # ("This file is session scratch — discard"), and it records one machine's
    # transient state. Linked from docs/index.md at its GitHub URL instead.
    - "!docs/elevated_session_runbook.md"
    - docs/tutorial/*.md
    # Quarto skips README.md by default, which would drop the tutorial's own
    # index -- its chapter table and suggested reading order. Listed explicitly.
    - docs/tutorial/README.md
    - docs/analysis/*.qmd
    - "!docs/CONTINUE_HERE.md"

website:
  title: "bare-metal"
  description: "Hand-tuned NVIDIA SASS kernels for RTX 3070 Ti (GA104, sm_86)"
  # Without site-url Quarto emits a sitemap.xml with relative locations, which
  # is not a valid sitemap, and social/canonical tags resolve wrongly.
  site-url: "https://pjt222.github.io/bare-metal/"
  repo-url: "https://github.com/pjt222/bare-metal"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Start here"
        menu:
          - README.md
          - SETUP.md
          - CONTRIBUTING.md
          - AGENTS.md
          - CHANGELOG.md
      - text: "Documentation"
        href: docs/index.md
      - text: "Tutorial"
        menu:
          - docs/tutorial/01-sass-hello-world.md
          - docs/tutorial/02-gemm-from-scratch.md
          - docs/tutorial/03-int8-tensor-cores.md
          - docs/tutorial/04-software-pipelining.md
          - docs/tutorial/05-flash-attention.md
          - docs/tutorial/06-the-four-laws.md
      - text: "Analysis"
        href: docs/analysis/kernel_architecture.qmd
      # Absolute URL on purpose: a relative link would make Quarto resolve the
      # app against the SOURCE tree and copy its unbuilt index.html into the
      # site, which is exactly how #187 ended up publishing a broken copy. The
      # bundle is placed into _site by the workflow, after the render.
      - text: "Knowledge graph"
        href: "https://pjt222.github.io/bare-metal/viz/research-map/"
    right:
      - icon: github
        href: https://github.com/pjt222/bare-metal
        aria-label: "Source on GitHub"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
